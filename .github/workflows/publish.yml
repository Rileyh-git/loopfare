name: Publish CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches package version
        run: >-
          node --input-type=module -e "import pkg from './packages/cli/package.json' with { type: 'json' }; if (process.env.GITHUB_REF_NAME !== 'v' + pkg.version) { throw new Error('Tag must match CLI version v' + pkg.version); }"
      - run: npm publish -w @loopfare/cli --access public
