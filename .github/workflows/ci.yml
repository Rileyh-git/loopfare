name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node: [22.19.0, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Build tools (including TypeScript's native binary) are required even
      # when the deployment environment defaults to production-only installs.
      - run: npm ci --include=dev --include=optional
        env:
          NODE_ENV: production
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
